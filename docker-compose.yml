services:
  postgres:
    image: postgres:17-alpine
    container_name: radiology-exams-postgres
    environment:
      POSTGRES_DB: radiology_exams
      POSTGRES_USER: radiology_exams_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: