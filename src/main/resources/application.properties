spring.application.name=radiology-exams-api
spring.datasource.url=jdbc:postgresql://localhost:5432/radiology_exams
spring.datasource.username=radiology_exams_user
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


orthanc.base-url=${ORTHANC_BASE_URL:http://localhost:8042}
orthanc.username=${ORTHANC_USERNAME:orthanc_user}
orthanc.password=${ORTHANC_PASSWORD:password}
orthanc.connect-timeout=${ORTHANC_CONNECT_TIMEOUT:3s}
orthanc.read-timeout=${ORTHANC_READ_TIMEOUT:30s}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=250MB
